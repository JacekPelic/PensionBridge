name: Deploy to GitHub Pages

on:
  push:
    branches: [master, redesign]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # --- Production (master) -> site root ---
      - uses: actions/checkout@v4
        with:
          ref: master
          path: master-src

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: master-src/retir-ai/package-lock.json

      - name: Install dependencies (master)
        working-directory: master-src/retir-ai
        run: npm ci

      - name: Build (master)
        working-directory: master-src/retir-ai
        run: npx next build

      - name: Stage production output
        working-directory: master-src/retir-ai
        run: |
          cp out/index.html out/404.html
          mkdir -p "$GITHUB_WORKSPACE/site"
          cp -r out/. "$GITHUB_WORKSPACE/site/"

      # --- Redesign -> /redesign subpath ---
      - uses: actions/checkout@v4
        with:
          ref: redesign
          path: redesign-src

      - name: Install dependencies (redesign)
        working-directory: redesign-src/retir-ai
        run: npm ci

      - name: Build (redesign)
        working-directory: redesign-src/retir-ai
        env:
          NEXT_PUBLIC_BASE_PATH: /PensionBridge/redesign
        run: npx next build

      - name: Stage redesign output
        working-directory: redesign-src/retir-ai
        run: |
          cp out/index.html out/404.html
          mkdir -p "$GITHUB_WORKSPACE/site/redesign"
          cp -r out/. "$GITHUB_WORKSPACE/site/redesign/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
